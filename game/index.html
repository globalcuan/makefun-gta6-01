<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211e23;color:#fff1d0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#game-canvas{display:block;width:100%;height:100%}#hud,#debug{position:fixed;z-index:2;pointer-events:none;text-shadow:0 2px 5px #211e23}#hud{left:20px;bottom:18px;font-weight:700}#debug{right:16px;top:12px;white-space:pre;font:12px ui-monospace,monospace;color:#ffe4a8}#start-screen{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,rgba(44,37,41,.82),rgba(112,54,45,.72))}#start-screen[hidden]{display:none}.panel{width:min(540px,92vw);padding:38px;border:1px solid rgba(255,222,163,.45);background:rgba(36,35,38,.84);box-shadow:0 20px 90px #1c1718;border-radius:10px}h1{margin:0;color:#f2a56c;font-size:clamp(42px,8vw,76px);letter-spacing:.06em;line-height:1}p{color:#e8c98f}.controls{line-height:1.8;color:#e8c98f;margin:22px 0}button{display:block;width:100%;padding:14px;margin:10px 0;border:0;border-radius:4px;background:#c96f4a;color:#fff3d4;font:700 15px system-ui;letter-spacing:.08em;cursor:pointer}button:hover{background:#d97b6c}button[hidden]{display:none}
#hud{left:0;bottom:0;width:100%;height:100%;font-size:15px}.hud-left,.hud-right{position:absolute;top:18px;padding:12px 16px;background:rgba(20,24,27,.62);border-radius:6px}.hud-left{left:18px;max-width:42vw}.hud-right{right:18px;text-align:right;min-width:160px}#hud-objective{font-size:16px}#hud-timer{color:#ffd34e;margin-top:5px}#hud-money{font-size:20px;color:#ffe4a8}#hud-health{height:8px;margin:7px 0;background:#4a3030;border-radius:5px;overflow:hidden}#hud-health i{display:block;width:100%;height:100%;background:#67c783;transition:width .2s}#hud-stars{font-size:20px;letter-spacing:2px}#hud-banner{position:absolute;left:50%;bottom:85px;transform:translateX(-50%);padding:12px 22px;background:rgba(24,25,29,.8);border-radius:5px;text-align:center;min-width:220px}#hud-center{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:rgba(25,12,16,.32);font-size:clamp(34px,7vw,76px);color:#ffcf9d}#hud-center small{font-size:18px}#hud-flash{position:absolute;inset:0;background:radial-gradient(transparent 45%,rgba(180,0,0,.65));opacity:0;transition:opacity .16s}#hud-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;color:#fff1d0;opacity:.8}#minimap-canvas{position:absolute;left:18px;bottom:18px;width:180px;height:180px;border:2px solid rgba(255,230,190,.7);border-radius:50%;box-shadow:0 3px 18px #111}
